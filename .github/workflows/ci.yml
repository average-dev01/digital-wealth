name: CI

# CI gate only — lint, dependency audit, backend tests, frontend build/
# typecheck. Does not deploy: each Railway service is connected directly to
# this GitHub repo and deploys on push to main independently of this
# workflow's result (see docs/RAILWAY_DEPLOY.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version` input: pnpm/action-setup reads the `packageManager`
      # field in package.json (pnpm@10.33.0) so this always matches the
      # version every contributor's local install uses.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Fails the build on any moderate-or-higher advisory in the resolved
      # dependency tree (transitive included) — this is workspace-wide, not
      # per-package, since a single lockfile covers both.
      - run: pnpm audit --audit-level=moderate

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dwp
          POSTGRES_PASSWORD: dwp_ci_password
          POSTGRES_DB: digital_wealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dwp:dwp_ci_password@localhost:5432/digital_wealth?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      COOKIE_SECRET: ci-cookie-secret
      FRONTEND_ORIGIN: http://localhost:3000
      NODE_ENV: test
      PRICE_FEED_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend test

  frontend-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend build
